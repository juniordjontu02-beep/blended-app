<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blended</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#131316;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#131316;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo-b{width:32px;height:32px;background:#fff;color:#000;border-radius:8px;display:grid;place-items:center;font-weight:900}
.logo-text{font-weight:800;font-size:20px}
.icons{display:flex;gap:18px;font-size:20px}
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 66px;text-align:center;cursor:pointer}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#8b5cf6,#ec4899,#f97316);margin:auto}
.story-ring img,.story-ring .inner{width:100%;height:100%;border-radius:50%;background:#222;border:3px solid #131316;object-fit:cover;display:grid;place-items:center}
.add .story-ring{background:none;border:2px dashed #555}
.add .inner{font-size:24px;color:#888}
.story-name{font-size:11px;margin-top:6px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list{padding:0 8px}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;cursor:pointer}
.chat-row:active{background:#1e1e22}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center}
.chat-name{font-weight:700;font-size:15px}
.chat-time{font-size:12px;color:#888}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.chat-last{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.badge{background:#3b82f6;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.check{color:#22c55e;font-size:12px}
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#viewer.active{display:flex}
.viewer-top{height:4px;background:#333;margin:8px;border-radius:2px;overflow:hidden}
.viewer-progress{height:100%;width:0%;background:#fff;transition:width 0.1s linear}
.viewer-header{padding:12px;display:flex;align-items:center;gap:10px}
.viewer-close{margin-left:auto;font-size:24px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><div class="logo-b">B</div><div class="logo-text">Blended</div></div>
  <div class="icons"><span>🔍</span><span>←</span></div>
</div>

<div class="stories">
  <div class="story add" onclick="openStory('Add Story')"><div class="story-ring"><div class="inner">+</div></div><div class="story-name">Add Story</div></div>
  <div class="story" onclick="openStory('Alex')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=1"></div><div class="story-name">Alex</div></div>
  <div class="story" onclick="openStory('Sam')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=2"></div><div class="story-name">Sam</div></div>
  <div class="story" onclick="openStory('Jordan')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=3"></div><div class="story-name">Jordan</div></div>
  <div class="story" onclick="openStory('Taylor')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=4"></div><div class="story-name">Taylor</div></div>
  <div class="story" onclick="openStory('Vanne')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=5"></div><div class="story-name">Vanne</div></div>
  <div class="story" onclick="openStory('Nouma')"><div class="story-ring"><img src="https://i.pravatar.cc/100?img=6"></div><div class="story-name">Nouma</div></div>
</div>

<div class="chat-list">
  <div class="chat-row" onclick="location.href='chat.html'">
    <img class="avatar" src="https://i.pravatar.cc/100?img=1">
    <div class="chat-info"><div class="chat-top"><span class="chat-name">Alex</span><span class="chat-time">2m</span></div><div class="chat-bottom"><span class="chat-last">You're on for tomorrow? 😎</span><span class="badge">2</span></div></div>
  </div>
  <div class="chat-row"><img class="avatar" src="https://i.pravatar.cc/100?img=2"><div class="chat-info"><div class="chat-top"><span class="chat-name">Sam</span><span class="chat-time">10m</span></div><div class="chat-bottom"><span class="chat-last">Sent a photo</span><span class="check">✓✓</span></div></div></div>
  <div class="chat-row"><img class="avatar" src="https://i.pravatar.cc/100?img=3"><div class="chat-info"><div class="chat-top"><span class="chat-name">Jordan</span><span class="chat-time">15m</span></div><div class="chat-bottom"><span class="chat-last">Seen the new design? I love it 🔥</span></div></div></div>
  <div class="chat-row"><img class="avatar" src="https://i.pravatar.cc/100?img=4"><div class="chat-info"><div class="chat-top"><span class="chat-name">Taylor</span><span class="chat-time">1h</span></div><div class="chat-bottom"><span class="chat-last">Voice note · 0:12</span></div></div></div>
  <div class="chat-row"><img class="avatar" src="https://i.pravatar.cc/100?img=5"><div class="chat-info"><div class="chat-top"><span class="chat-name">Vanne</span><span class="chat-time">2h</span></div><div class="chat-bottom"><span class="chat-last">Salut Bafoussam ❤️</span></div></div></div>
  <div class="chat-row"><img class="avatar" src="https://i.pravatar.cc/100?img=6"><div class="chat-info"><div class="chat-top"><span class="chat-name">Nouma</span><span class="chat-time">2h</span></div><div class="chat-bottom"><span class="chat-last">Dispo ce soir?</span></div></div></div>
</div>

<div id="viewer" onclick="closeStory()">
  <div class="viewer-top"><div id="progress" class="viewer-progress"></div></div>
  <div class="viewer-header"><img id="viewer-img" style="width:32px;height:32px;border-radius:50%"><span id="viewer-name"></span><span class="viewer-close">✕</span></div>
  <div style="flex:1;display:grid;place-items:center;font-size:24px" id="viewer-text"></div>
</div>

<script>
let progInt;
function openStory(name){
  document.getElementById('viewer-name').textContent=name;
  document.getElementById('viewer-text').textContent=name+' Story 🔥';
  document.getElementById('viewer').classList.add('active');
  let p=0; document.getElementById('progress').style.width='0%';
  progInt=setInterval(()=>{p+=1; document.getElementById('progress').style.width=p+'%'; if(p>=100) closeStory()},30);
}
function closeStory(){document.getElementById('viewer').classList.remove('active'); clearInterval(progInt)}
</script>
</body>
      </html>
