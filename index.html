<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;font-family:Arial}
.card{background:#fff;width:100%;max-width:390px;border-radius:36px;overflow:hidden}
.photo-wrap{padding:18px}.photo-box{background:#fff;width:100%;height:460px;border-radius:28px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-box img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:28px}
.info{padding:22px}
.name-row{display:flex;justify-content:space-between;align-items:center}
.name{font-size:29px;font-weight:900}.badge{background:#000;color:#00ff88;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:900}
.city{color:#777;font-size:15px;margin-bottom:16px}
.quote{background:#f6f6f7;padding:16px;border-radius:16px;color:#333;font-style:italic;font-size:16px}
.role{margin-top:16px;font-weight:900}
.social{margin-top:14px;display:flex;align-items:center;gap:10px}
.insta{display:flex;align-items:center;gap:8px;background:#f0f0f2;padding:10px 14px;border-radius:20px;text-decoration:none;color:#000;font-weight:700;font-size:14px}
.actions{margin-top:18px;display:flex;gap:14px}
.btn{flex:1;padding:18px;border:none;border-radius:28px;font-weight:900;font-size:17px;cursor:pointer}
.btn-no{background:#f0f0f2}.btn-yes{background:#00ff88;box-shadow:0 8px 24px rgba(0,255,136,.4)}
</style></head><body>
<div class="card">
<div class="photo-wrap"><div class="photo-box">
<img src="https://i.ibb.co/v4cDp8kh/received-29285732557780191.jpg" alt="B">
</div></div>
<div class="info">
<div class="name-row"><div class="name">Djontu Junior</div><div class="badge">● LIVE</div></div>
<div class="city">Bafoussam, Cameroun</div>
<div class="quote">Rien n'est impossible et rien ne s'obtient facilement</div>
<div class="role">18 ans • Fondateur de BLENDED</div>

<!-- LOGO INSTAGRAM UNE FOIS ICI -->
<div class="social">
<a class="insta" href="https://instagram.com/juniordjontu02" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" width="20" height="20"> Instagram
</a>
</div>

<div class="actions">
<button class="btn btn-no" onclick="alert('Passé')">✕</button>
<button class="btn btn-yes" onclick="location.href='chat.html'">♥ LIKE</button>
</div>
</div>
</div>
</body></html>
