<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blended - Voice Photo Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:white;min-height:100vh;padding-bottom:80px}
.header{padding:20px;text-align:center;background:#000;position:sticky;top:0;z-index:10}
.header h1{color:#ff2e93;font-size:28px}
.card{background:#222;border-radius:20px;padding:15px;margin:15px;text-align:center}
.card img{width:90px;height:90px;border-radius:50%;object-fit:cover}
.card h2{color:#ff2e93;margin:8px 0}
.media-bar{display:flex;justify-content:center;gap:15px;margin-top:15px;flex-wrap:wrap}
.icon-btn{background:#333;border:none;width:50px;height:50px;border-radius:50%;font-size:22px;cursor:pointer;color:white}
.icon-btn:active{background:#ff2e93}
.preview{margin-top:10px}
.preview img,.preview video{width:100%;border-radius:15px;max-height:200px;object-fit:cover}
.preview audio{width:100%;margin-top:10px}
.chat-input{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;gap:8px;align-items:center}
.chat-input input{flex:1;padding:12px;border-radius:25px;border:none;background:#222;color:white}
.rec{color:red;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="header">
<h1>Blended 💜 Voice</h1>
<p>Photos • Vocals • Vidéos</p>
</div>

<div class="card">
<img src="https://i.pravatar.cc/150?img=5">
<h2>Alex, 24</h2>
<p>Envoie moi un vocal 🎤</p>
<div class="media-bar">
<button class="icon-btn" onclick="document.getElementById('photoAlex').click()">📷</button>
<button class="icon-btn" id="voiceAlex" onclick="toggleVoice('Alex')">🎤</button>
<button class="icon-btn" onclick="document.getElementById('videoAlex').click()">🎥</button>
</div>
<div class="preview" id="previewAlex"></div>
<input type="file" id="photoAlex" accept="image/*" hidden onchange="showPhoto(this,'previewAlex')">
<input type="file" id="videoAlex" accept="video/*" hidden onchange="showVideo(this,'previewAlex')">
</div>

<div class="card">
<img src="https://i.pravatar.cc/150?img=32">
<h2>Sam, 22</h2>
<p>Partage ta vibe 📸</p>
<div class="media-bar">
<button class="icon-btn" onclick="document.getElementById('photoSam').click()">📷</button>
<button class="icon-btn" id="voiceSam" onclick="toggleVoice('Sam')">🎤</button>
<button class="icon-btn" onclick="document.getElementById('videoSam').click()">🎥</button>
</div>
<div class="preview" id="previewSam"></div>
<input type="file" id="photoSam" accept="image/*" hidden onchange="showPhoto(this,'previewSam')">
<input type="file" id="videoSam" accept="video/*" hidden onchange="showVideo(this,'previewSam')">
</div>

<div class="chat-input">
<input type="text" placeholder="Message...">
<button class="icon-btn" style="background:#ff2e93">➤</button>
</div>

<script>
function showPhoto(input, previewId){
 const file=input.files[0];
 if(file){
  const url=URL.createObjectURL(file);
  document.getElementById(previewId).innerHTML=`<img src="${url}"><p>✅ Photo ajoutée</p>`;
 }
}
function showVideo(input, previewId){
 const file=input.files[0];
 if(file){
  const url=URL.createObjectURL(file);
  document.getElementById(previewId).innerHTML=`<video src="${url}" controls></video><p>✅ Vidéo ajoutée</p>`;
 }
}
let recorder, isRecording=false;
async function toggleVoice(name){
 const btn=document.getElementById('voice'+name);
 const preview=document.getElementById('preview'+name);
 if(!isRecording){
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   recorder=new MediaRecorder(stream);
   let chunks=[];
   recorder.ondataavailable=e=>chunks.push(e.data);
   recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'audio/webm'});
    const url=URL.createObjectURL(blob);
    preview.innerHTML+=`<audio src="${url}" controls></audio><p>✅ Vocal pour ${name}</p>`;
   };
   recorder.start();
   isRecording=true;
   btn.innerHTML='⏹️'; btn.classList.add('rec');
  }catch{alert('Autorise le micro!')}
 }else{
  recorder.stop(); isRecording=false;
  btn.innerHTML='🎤'; btn.classList.remove('rec');
 }
}
</script>
</body>
</html>
