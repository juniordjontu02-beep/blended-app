<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #222;align-items:center;position:sticky;top:0;background:#000;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#8a5cf5}
.stories{display:flex;gap:15px;overflow-x:auto;padding:12px 15px;border-bottom:1px solid #222}
.story{text-align:center;min-width:65px;cursor:pointer}
.story img{width:60px;height:60px;border-radius:50%;border:2px solid #8a5cf5}
.story p{font-size:12px;margin-top:5px}
.post{border-bottom:1px solid #222;padding:15px}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post-head img{width:40px;height:40px;border-radius:50%}
.post-img{width:100%;border-radius:15px;margin:10px 0;max-height:400px;object-fit:cover}
.actions{display:flex;gap:20px;font-size:22px;margin:10px 0}
.input-box{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;gap:10px;padding:10px;border-top:1px solid #222}
.input-box input{flex:1;background:#222;border:none;padding:12px;border-radius:20px;color:#fff;outline:none}
.input-box button{background:linear-gradient(90deg,#8a5cf5,#ec4899);border:none;padding:10px 20px;border-radius:20px;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<div class="logo"><span>B</span> BLENDED</div>
<div><span style="cursor:pointer" onclick="location.href='chat.html'">🔔</span> <span style="cursor:pointer;margin-left:10px" onclick="location.href='ib.html'">✈️</span></div>
</div>

<div class="stories">
<div class="story" onclick="location.href='chat.html'"><img src="https://i.pravatar.cc/100?img=5"><p>MIRA</p></div>
<div class="story" onclick="location.href='ib.html'"><img src="https://i.pravatar.cc/100?img=32"><p>IB</p></div>
<div class="story" onclick="location.href='chat.html'"><img src="https://i.pravatar.cc/100?img=8"><p>Joni</p></div>
<div class="story" onclick="location.href='chat.html'"><img src="https://i.pravatar.cc/100?img=9"><p>Indra</p></div>
<div class="story" onclick="location.href='chat.html'"><img src="https://i.pravatar.cc/100?img=10"><p>Omos</p></div>
</div>

<div id="feed">
<div class="post">
<div class="post-head"><img src="https://i.pravatar.cc/100?img=1"><b>aicha__cm</b> • Douala</div>
<img class="post-img" src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600">
<div class="actions"><span onclick="this.innerText=this.innerText=='🤍'?'❤️':'🤍'">🤍</span> <span>💬</span> <span onclick="location.href='ib.html'">✈️</span></div>
<b>1,248 likes</b><p style="margin-top:5px"><b>aicha__cm</b> Belle journée à Kribi 🌴 #Cameroun #237</p>
</div>
</div>

<div class="input-box">
<input id="postInput" placeholder="Quoi de neuf à Bafoussam ?">
<button onclick="post()">Poster</button>
</div>

<script>
function post(){
let v=document.getElementById('postInput').value;
if(!v) return;
let feed=document.getElementById('feed');
feed.innerHTML='<div class="post"><div class="post-head"><img src="https://i.pravatar.cc/100?img=12"><b>junior</b> • Bafoussam</div><p style="padding:10px 0">'+v+'</p><div class="actions"><span>🤍</span> <span>💬</span> <span>✈️</span></div></div>'+feed.innerHTML;
document.getElementById('postInput').value='';
}
</script>

</body>
</html>
