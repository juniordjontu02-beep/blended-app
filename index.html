<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0}
.header{padding:15px;background:#111;display:flex;justify-content:space-between;align-items:center}
.user-list{padding:10px}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#1a1a1a;border-radius:15px;margin-bottom:8px;cursor:pointer}
.user-card img{width:45px;height:45px;border-radius:50%;object-fit:cover}
.user-card.initial{width:45px;height:45px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:bold}
.chat-box{height:70vh;overflow-y:auto;padding:10px}
.msg{background:#222;padding:10px 15px;border-radius:15px;margin:5px 0;max-width:70%}
.msg.me{background:#005c4b;margin-left:auto}
input{width:100%;padding:12px;background:#222;border:none;border-radius:25px;color:#fff}
</style>
</head>
<body>

<div class="header">
  <b>Blended - Privé</b>
  <span id="myName">Junior</span>
</div>

<!-- LISTE AVEC PHOTOS -->
<div id="userListView">
  <div style="padding:10px">
    <input id="search" placeholder="🔍 Rechercher..." oninput="filtrer(this.value)">
  </div>
  <div class="user-list" id="userList">
    <!-- Généré automatiquement -->
  </div>
</div>

<!-- CHAT PRIVÉ -->
<div id="chatView" style="display:none">
  <div class="header">
    <span onclick="retour()" style="cursor:pointer">← Retour</span>
    <div style="display:flex;align-items:center;gap:8px">
      <img id="chatPhoto" src="" style="width:30px;height:30px;border-radius:50%">
      <b id="chatName"></b>
    </div>
  </div>
  <div class="chat-box" id="messages"></div>
  <div style="padding:10px;display:flex;gap:8px">
    <input id="msgInput" placeholder="Écris un message...">
    <button onclick="envoyer()" style="background:#005c4b;border:none;color:#fff;padding:12px 20px;border-radius:25px">Envoyer</button>
  </div>
</div>

<script>
// TES UTILISATEURS AVEC PHOTOS - change les liens
let users = [
  {name:"Vanne", photo:"https://i.pravatar.cc/150?img=5"},
  {name:"Djontu", photo:"https://i.pravatar.cc/150?img=8"},
  {name:"Nouma ❤️", photo:"https://i.pravatar.cc/150?img=9"},
  {name:"Junior", photo:"https://i.pravatar.cc/150?img=12"}
];

let currentChat = null;
let messages = [
  {from:"Vanne", to:"Junior", text:"Salut"},
  {from:"Nouma ❤️", to:"Junior", text:"Bonjour, C'est comment"},
  {from:"Junior", to:"Nouma ❤️", text:"Çava et toi"}
];

function afficherUsers(list){
  document.getElementById('userList').innerHTML = list.map(u=>`
    <div class="user-card" onclick="ouvrirChat('${u.name}')">
      ${u.photo? `<img src="${u.photo}">` : `<div class="initial">${u.name[0]}</div>`}
      <div><b>${u.name}</b><br><small style="color:#888">En ligne</small></div>
    </div>
  `).join('');
}

function ouvrirChat(nom){
  currentChat = users.find(u=>u.name===nom);
  document.getElementById('userListView').style.display='none';
  document.getElementById('chatView').style.display='block';
  document.getElementById('chatName').innerText = currentChat.name;
  document.getElementById('chatPhoto').src = currentChat.photo;
  afficherMessages();
}

function retour(){
  document.getElementById('chatView').style.display='none';
  document.getElementById('userListView').style.display='block';
}

function afficherMessages(){
  let moi = "Junior";
  let filtres = messages.filter(m=>
    (m.from===moi && m.to===currentChat.name) ||
    (m.from===currentChat.name && m.to===moi)
  );
  document.getElementById('messages').innerHTML = filtres.map(m=>`
    <div class="msg ${m.from===moi?'me':''}">${m.text}</div>
  `).join('');
}

function envoyer(){
  let txt = document.getElementById('msgInput').value;
  if(!txt) return;
  messages.push({from:"Junior", to:currentChat.name, text:txt});
  document.getElementById('msgInput').value='';
  afficherMessages();
}

function filtrer(q){
  let f = users.filter(u=>u.name.toLowerCase().includes(q.toLowerCase()));
  afficherUsers(f);
}

afficherUsers(users);
</script>
</body>
</html>
