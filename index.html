<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{padding:15px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.user-list{padding:10px;max-width:500px;margin:0 auto}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#111;margin:8px 0;border-radius:14px;cursor:pointer;border:1px solid #222}
.user-card img{width:45px;height:45px;border-radius:50%;object-fit:cover}
.user-card.initial{width:45px;height:45px;background:#333;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold;font-size:20px}
.user-card:hover{background:#1a1a1a;border-color:#00e676}
.badge{margin-left:auto;background:#00e676;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<b>blended 💬</b>
<b id="me" style="color:#00e676"></b>
</div>
<div class="user-list" id="list"></div>

<script>
let cur = JSON.parse(localStorage.getItem('blended_cur')||'null')
if(!cur){ location.href='login.html' }
document.getElementById('me').innerText = cur.n || cur.e

let users = JSON.parse(localStorage.getItem('users')||'[]')
let msgs = JSON.parse(localStorage.getItem('blended_msgs')||'[]')

function render(){
  let h=''
  users.forEach(u=>{
    if(u.n===cur.n) return
    let last = msgs.filter(m=>(m.from===cur.n&&m.to===u.n)||(m.from===u.n&&m.to===cur.n)).slice(-1)[0]
    let initial = u.n? u.n[0].toUpperCase() : '?'
    h+=`<div class="user-card" onclick="openIB('${u.n}')">
      ${u.av?`<img src="${u.av}">`:`<div class="user-card initial">${initial}</div>`}
      <div style="flex:1"><b>${u.n}</b><br><small style="color:#888">${last?last.txt.slice(0,30):'Clique pour parler en IB'}</small></div>
      <span class="badge">IB 📩</span>
    </div>`
  })
  document.getElementById('list').innerHTML = h || '<p style="text-align:center;color:#666;margin-top:50px">Aucun utilisateur<br>Crée un autre compte pour tester</p>'
}
function openIB(name){
  location.href='ib.html?user='+encodeURIComponent(name)
}
render()
</script>
</body>
</html>
