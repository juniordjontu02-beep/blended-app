<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLENDED</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}header{display:flex;justify-content:space-between;padding:12px;background:#111;position:sticky;top:0}button{padding:10px 16px;border-radius:20px;border:none;font-weight:700}#loginBox{padding:20px;text-align:center;margin-top:30px;max-width:380px;margin:auto}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff}.post{border:1px solid #222;margin:10px;border-radius:12px;overflow:hidden;background:#0a0a0a}.post img{width:100%}.post-info{padding:10px}</style></head><body><header><b>BLENDED ❤️</b><button onclick="addPost()">+ Post</button></header><div id="loginBox"><h2>BLENDED</h2><br><input id="name" placeholder="Ton nom"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><br><br><button onclick="signup()" style="background:#fff;color:#000;width:100%">Créer compte</button><br><br><button onclick="login()" style="background:#222;color:#fff;width:100%;border:1px solid #444">Login</button><p id="msg" style="margin-top:12px;color:#f55"></p></div><div id="feed" style="display:none"></div><script>
const SUPA_URL="https://zdfxuhjobcbfzymejkcm.supabase.co";const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkZnh1aGpvYmNiZnp5bWVqa2NtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDgxMTIsImV4cCI6MjEwNjA4NDExMn0.hskZtCKc1BQMxCc_dZfq7b4Uzf5xqqnfRe462h0Ru8Y";const supa=supabase.createClient(SUPA_URL,SUPA_KEY);let cur=JSON.parse(localStorage.getItem('b_cur')||'null');if(cur)showFeed();async function signup(){let n=name.value,e=email.value,p=pass.value;if(!n||!e||!p)return msg.innerText='Remplis tout';let {error}=await supa.from('users').insert({name:n,email:e,password:p,avatar:'https://i.pravatar.cc/100?u='+e});msg.innerText=error?error.message:'✅ Créé! Clique Login'}async function login(){let e=email.value,p=pass.value;let {data,error}=await supa.from('users').select('*').eq('email',e).eq('password',p);if(error)return msg.innerText=error.message;if(data.length){localStorage.setItem('b_cur',JSON.stringify(data[0]));cur=data[0];showFeed()}else msg.innerText='Faux mot de passe'}function showFeed(){loginBox.style.display='none';feed.style.display='block';loadPosts()}async function loadPosts(){let {data,error}=await supa.from('posts').select('*').order('created_at',{ascending:false});if(error){feed.innerHTML=error.message;return}feed.innerHTML=data.length?'':'<p style="padding:30px;text-align:center;color:#888">Aucun post, clique + Post</p>';data.forEach(o=>{feed.innerHTML+=`<div class=post><div class=post-info><b>${o.username}</b></div><img src=${o.image}><div class=post-info><p>${o.caption}</p><button onclick="like('${o.id}',${o.likes||0})">❤️ ${o.likes||0}</button><button onclick="ib('${o.username}')" style="background:#222;color:#fff;margin-left:5px">💬 IB</button></div></div>`})}async function like(id,l){await supa.from('posts').update({likes:l+1}).eq('id',id);loadPosts()}async function ib(r){let t=prompt('Message à '+r);if(!t)return;await supa.from('messages').insert({sender:cur.name,receiver:r,message:t});alert('Envoyé ✅')}async function addPost(){let c=prompt('Légende:');if(!c)return;let img='https://picsum.photos/seed/'+Math.random()+'/600/600';await supa.from('posts').insert({username:cur.name,avatar:cur.avatar,image:img,caption:c,likes:0});loadPosts()}
</script></body></html>
