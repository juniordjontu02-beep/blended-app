<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED - By Djontu Junior</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;font-family: -apple-system,BlinkMacSystemFont,Arial}
.card{background:#fff;width:100%;max-width:390px;border-radius:36px;overflow:hidden;box-shadow:0 20px 80px rgba(255,255,255,.15)}
.photo-wrap{padding:18px}
.photo-box{background:#fff;width:100%;height:460px;border-radius:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.photo-box img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:28px}
.info{padding:22px 22px 20px}
.name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.name{font-size:29px;font-weight:900;color:#000;letter-spacing:-.5px}
.badge{background:#000;color:#00ff88;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}
.badge-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block}
.city{color:#777;font-size:15px;margin-bottom:16px}
.quote{background:#f6f6f7;padding:16px 16px;border-radius:16px;color:#333;font-style:italic;line-height:1.4;font-size:16px}
.role{margin-top:16px;font-weight:900;color:#000;font-size:16px}
.actions{margin-top:20px;display:flex;gap:14px}
.btn{flex:1;padding:18px;border:none;border-radius:28px;font-weight:900;font-size:17px;cursor:pointer;transition:.2s}
.btn-no{background:#f0f0f2;color:#000}
.btn-no:active{transform:scale(.96)}
.btn-yes{background:#00ff88;color:#000;box-shadow:0 8px 24px rgba(0,255,136,.4)}
.btn-yes:active{transform:scale(.96)}
.logo-top{text-align:center;padding:12px 0 0;font-weight:900;letter-spacing:3px;font-size:12px;color:#aaa}
.logo-top span{color:#000}
</style>
</head>
<body>
<div class="card">
<div class="logo-top">B <span>BLENDED</span></div>
<div class="photo-wrap">
<div class="photo-box">
<img src="https://i.ibb.co/4pJb0X0Y/blended-b-clean-white.png" alt="B Logo" onerror="this.src='https://i.ibb.co/v4cDp8kh/received-29285732557780191.jpg'" style="background:white">
</div>
</div>
<div class="info">
<div class="name-row">
<div class="name">Djontu Junior</div>
<div class="badge"><span class="badge-dot"></span> LIVE</div>
</div>
<div class="city">Bafoussam, Cameroun</div>
<div class="quote">Rien n'est impossible et rien ne s'obtient facilement</div>
<div class="role">18 ans • Fondateur de BLENDED</div>
<div class="actions">
<button class="btn btn-no" onclick="nextProfile()">✕</button>
<button class="btn btn-yes" onclick="location.href='chat.html'">♥ LIKE</button>
</div>
</div>
</div>
<script>
function nextProfile(){
alert("Plus de profils pour le moment - Invite tes amis via inscription.html");
}
// Petit effet pour enlever les coins noirs si l'image en a
document.querySelector('.photo-box img').style.background='white';
</script>
</body>
</html>
