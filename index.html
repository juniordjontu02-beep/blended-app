<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLENDED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:sans-serif;background:#000;color:#fff}header{padding:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between}button{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:bold} .post{border-bottom:1px solid #222;padding:12px} .post img{width:100%;border-radius:12px;margin-top:8px} .like{font-size:24px;cursor:pointer}</style>
</head><body>
<header><b>BLENDED</b><button onclick="newPost()">+ Post</button></header>
<div id="feed"></div>
<script>
const supa = supabase.createClient('https://TON_URL.supabase.co','TA_CLE_ANON');
async function load(){
  let {data} = await supa.from('posts').select('*').order('created_at',{ascending:false});
  document.getElementById('feed').innerHTML = data.map(p=>`
    <div class="post"><b>${p.username}</b><br>${p.caption}<br><img src="${p.image}"><br>
    <span class="like" onclick="like('${p.id}',${p.likes})">${p.likes>0?'❤️':'🤍'} ${p.likes}</span>
    <span style="float:right;cursor:pointer" onclick="msg('${p.username}')">💬 IB</span>
    </div>`).join('');
}
async function like(id,l){await supa.from('posts').update({likes:l+1}).eq('id',id); load();}
async function newPost(){
  let img=prompt('Lien image:'); let cap=prompt('Caption:'); if(!img) return;
  await supa.from('posts').insert({username:'Moi',avatar:'',image:img,caption:cap,likes:0}); load();
}
async function msg(user){
  let t=prompt('Message à '+user+' :'); if(!t) return;
  await supa.from('messages').insert({sender:'Moi',receiver:user,message:t});
  alert('Envoyé à '+user);
}
load();
</script></body></html>
