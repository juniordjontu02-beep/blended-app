<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED - Swipe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial}
.stack{position:relative;width:100%;max-width:390px;height:680px}
.card{position:absolute;top:0;left:0;width:100%;background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);transition:transform .3s ease,opacity .3s ease;touch-action:none}
.photo-wrap{padding:18px}.photo-box{background:#fff;width:100%;height:440px;border-radius:28px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-box img{width:85%;height:85%;object-fit:contain}
.info{padding:20px}.name-row{display:flex;justify-content:space-between;align-items:center}
.name{font-size:26px;font-weight:900}.badge{background:#000;color:#00ff88;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900}
.city{color:#777;font-size:14px;margin-bottom:12px}.quote{background:#f6f6f7;padding:14px;border-radius:14px;color:#333;font-style:italic;font-size:15px}
.role{margin-top:12px;font-weight:900;font-size:14px}
.actions{margin-top:16px;display:flex;gap:12px;justify-content:center}
.btn{width:60px;height:60px;border-radius:50%;border:none;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.btn-no{background:#fff;color:#ff4458;border:1px solid #ff4458}
.btn-yes{background:#00ff88;color:#000}
.like-label,.nope-label{position:absolute;top:30px;padding:10px 20px;border-radius:10px;font-weight:900;font-size:22px;border:4px solid;opacity:0;transform:rotate(-10deg)}
.like-label{left:20px;color:#00ff88;border-color:#00ff88}.nope-label{right:20px;color:#ff4458;border-color:#ff4458;transform:rotate(10deg)}
</style></head><body>
<div class="stack" id="stack"></div>
<script>
const profiles=[
{name:"Djontu Junior",city:"Bafoussam, Cameroun",quote:"Rien n'est impossible et rien ne s'obtient facilement",role:"18 ans • Fondateur de BLENDED",img:"https://i.ibb.co/v4cDp8kh/received-29285732557780191.jpg"},
{name:"Amina",city:"Douala, Cameroun",quote:"Ambitieuse et passionnée",role:"19 ans • Étudiante",img:"https://i.pravatar.cc/400?img=5"},
{name:"Kevin",city:"Yaoundé, Cameroun",quote:"Entrepreneur dans l'âme",role:"20 ans • Developer",img:"https://i.pravatar.cc/400?img=12"},
{name:"Sandra",city:"Bafoussam, Cameroun",quote:"Rêveuse mais déterminée",role:"18 ans • Designer",img:"https://i.pravatar.cc/400?img=9"}
];
let current=0;
function render(){
const stack=document.getElementById('stack');
stack.innerHTML='';
if(current>=profiles.length){stack.innerHTML='<div style="color:white;text-align:center;margin-top:200px"><h2>Plus de profils! 🔥</h2><p style="margin-top:10px">Invite tes amis via inscription.html</p><a href="inscription.html" style="color:#00ff88">+ Ajouter un profil</a></div>';return;}
const p=profiles[current];
stack.innerHTML=`
<div class="card" id="card">
<div class="like-label" id="likeLabel">LIKE</div><div class="nope-label" id="nopeLabel">NOPE</div>
<div class="photo-wrap"><div class="photo-box"><img src="${p.img}"></div></div>
<div class="info"><div class="name-row"><div class="name">${p.name}</div><div class="badge">● LIVE</div></div>
<div class="city">${p.city}</div><div class="quote">${p.quote}</div><div class="role">${p.role}</div>
<div class="actions"><button class="btn btn-no" onclick="swipe(-1)">✕</button><button class="btn btn-yes" onclick="swipe(1)">♥</button></div></div>
</div>`;
addDrag();
}
function swipe(dir){
const card=document.getElementById('card');
card.style.transform=`translateX(${dir*500}px) rotate(${dir*30}deg)`;
card.style.opacity='0';
setTimeout(()=>{
if(dir===1){location.href='chat.html';}
current++;render();
},300);
}
function addDrag(){
const card=document.getElementById('card');let startX=0,currentX=0,isDragging=false;
card.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;isDragging=true;card.style.transition='none'});
card.addEventListener('touchmove',e=>{if(!isDragging)return;currentX=e.touches[0].clientX-startX;card.style.transform=`translateX(${currentX}px) rotate(${currentX/10}deg)`;document.getElementById('likeLabel').style.opacity=currentX>50?currentX/100:0;document.getElementById('nopeLabel').style.opacity=currentX<-50?-currentX/100:0;});
card.addEventListener('touchend',()=>{isDragging=false;card.style.transition='transform .3s ease';if(currentX>100)swipe(1);else if(currentX<-100)swipe(-1);else{card.style.transform='translateX(0) rotate(0)';document.getElementById('likeLabel').style.opacity=0;document.getElementById('nopeLabel').style.opacity=0;}});
card.addEventListener('mousedown',e=>{startX=e.clientX;isDragging=true;card.style.transition='none'});
window.addEventListener('mousemove',e=>{if(!isDragging)return;currentX=e.clientX-startX;card.style.transform=`translateX(${currentX}px) rotate(${currentX/10}deg)`;document.getElementById('likeLabel').style.opacity=currentX>50?currentX/100:0;document.getElementById('nopeLabel').style.opacity=currentX<-50?-currentX/100:0;});
window.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;card.style.transition='transform .3s ease';if(currentX>100)swipe(1);else if(currentX<-100)swipe(-1);else{card.style.transform='translateX(0) rotate(0)';document.getElementById('likeLabel').style.opacity=0;document.getElementById('nopeLabel').style.opacity=0;}});
}
render();
</script></body></html>
