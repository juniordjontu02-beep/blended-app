<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLENDED</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.top{padding:15px;background:#111;font-weight:900;font-size:20px;position:sticky;top:0}
.card{padding:15px;border-bottom:1px solid #222;text-align:left;max-width:420px;margin:0 auto}
.card img{width:100%;border-radius:15px;margin-top:10px}
.btn{background:#fff;color:#000;padding:12px 20px;border-radius:30px;font-weight:bold;border:0;width:200px;margin-top:20px}
input{padding:12px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;text-align:center;width:200px}
</style>
</head>
<body>
<div class="top">BLENDED <span id="live" style="float:right;color:#00ff88;font-size:12px">● 1 LIVE</span></div>

<div id="gate" style="margin-top:100px">
<h1 style="font-size:40px">BLENDED</h1>
<p style="opacity:.6">Le scroll live</p>
<input id="pseudo" placeholder="Ton pseudo"><br>
<button class="btn" onclick="enter()">ENTRER</button>
</div>

<div id="feed" style="display:none"></div>

<script>
function enter(){
  let p = document.getElementById('pseudo').value || "Junior";
  document.getElementById('gate').style.display='none';
  document.getElementById('feed').style.display='block';
  document.getElementById('feed').innerHTML = `
    <div class="card"><b>${p}</b> • maintenant<br><br>Je suis en live sur Blended 🔥<br><img src="https://i.pravatar.cc/400?img=12"></div>
    <div class="card"><b>Sofia</b> • il y a 2min<br><br>Qui est encore debout? 👀<br><img src="https://i.pravatar.cc/400?img=5"></div>
    <div class="card"><b>Léo</b> • il y a 5min<br><br>Premier test ça marche!<br><img src="https://i.pravatar.cc/400?img=8"></div>
  `;
  document.getElementById('live').innerText = "● 1 LIVE ("+p+")";
}
</script>
</body>
</html>
