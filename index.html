<!-- BLENDED LIVE -->
<div id="blended-live" style="position:fixed;top:10px;left:10px;display:flex;gap:6px;z-index:99999;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:20px;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zdfxuhjobcbfzymjkcm.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkZnh1aGpvYmNiZnp5bWVqa2NtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDgxMTIsImV4cCI6MjEwNjA4NDExMn0.hskZtCKc1BQMxCc_dZfq7b4Uzf5xqqnfRe462h0Ru8Y";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function startBlended() {
    // 1. Je m'inscris
    let pseudo = localStorage.getItem('blended_pseudo') || "User_"+Math.floor(Math.random()*999);
    localStorage.setItem('blended_pseudo', pseudo);
    
    const { data: moi } = await supa.from('profiles').insert({
      pseudo: pseudo,
      photo: `https://i.pravatar.cc/100?u=${pseudo}`,
      en_ligne: true
    }).select().single();

    // 2. Fonction pour afficher tout le monde
    async function refreshLive() {
      const { data } = await supa.from('profiles').select('*').eq('en_ligne', true).order('derniere_vue', {ascending:false}).limit(10);
      document.getElementById('blended-live').innerHTML = 
        `<span style="color:white;font-size:12px;margin-right:4px">${data.length} en live ●</span>` +
        data.map(p => `<img src="${p.photo}" title="${p.pseudo}" style="width:32px;height:32px;border-radius:50%;border:2px solid #00ff88">`).join('');
    }

    refreshLive();

    // 3. Temps réel - quand quelqu'un arrive/part
    supa.channel('profiles-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, refreshLive)
      .subscribe();

    // 4. Hors ligne quand tu quittes
    window.addEventListener('beforeunload', () => {
      supa.from('profiles').update({ en_ligne: false }).eq('id', moi.id);
    });
  }
  startBlended();
</script>
