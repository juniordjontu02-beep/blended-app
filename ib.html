<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blended Privé</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0}
.header{padding:15px;background:#111;display:flex;gap:10px;align-items:center}
.header img{width:32px;height:32px;border-radius:50%}
.user-list{padding:10px}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#1a1a1a;border-radius:15px;margin-bottom:8px}
.user-card img{width:45px;height:45px;border-radius:50%;object-fit:cover}
.chat-box{height:70vh;overflow-y:auto;padding:10px}
.msg{background:#222;padding:10px 15px;border-radius:15px;margin:5px 0;max-width:70%}
.msg.me{background:#005c4b;margin-left:auto}
input{width:100%;padding:12px;background:#222;border:none;border-radius:25px;color:#fff;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/100?img=12"><b>Blended - Privé</b>
</div>

<div id="userListView">
<div style="padding:10px"><input id="search" placeholder="🔍 Rechercher..." oninput="filtrer(this.value)"></div>
<div class="user-list" id="userList"></div>
</div>

<div id="chatView" style="display:none">
<div class="header">
<span onclick="retour()" style="cursor:pointer">← Retour</span>
<img id="chatPhoto" src=""><b id="chatName"></b>
</div>
<div class="chat-box" id="messages"></div>
<div style="padding:10px;display:flex;gap:8px">
<input id="msgInput" placeholder="Message...">
<button onclick="envoyer()" style="background:#005c4b;border:none;color:#fff;padding:12px 20px;border-radius:25px">Envoyer</button>
</div>
</div>

<script>
let users = [
{name:"Vanne", photo:"https://i.pravatar.cc/150?img=5", lastSeen: new Date()},
{name:"Djontu", photo:"https://i.pravatar.cc/150?img=8", lastSeen: new Date(Date.now() - 1000*60*30)},
{name:"Nouma ❤️", photo:"https://i.pravatar.cc/150?img=9", lastSeen: new Date()},
{name:"Junior", photo:"https://i.pravatar.cc/150?img=12", lastSeen: new Date()}
];

let messages = [
{from:"Vanne", to:"Junior", text:"Salut"},
{from:"Nouma ❤️", to:"Junior", text:"Bonjour, C'est comment"},
{from:"Junior", to:"Nouma ❤️", text:"Çava et toi"}
];

let currentChat = null;

function getStatus(lastSeen){
let diff = (new Date() - new Date(lastSeen))/60000;
if(diff < 2) return "🟢 En ligne";
if(diff < 60) return `Vu il y a ${Math.floor(diff)} min`;
return "Vu aujourd'hui";
}

function afficherUsers(list){
document.getElementById('userList').innerHTML = list.map(u=>`
<div class="user-card" onclick="ouvrirChat('${u.name}')">
<div style="position:relative">
<img src="${u.photo}">
${(new Date() - new Date(u.lastSeen))/60000 < 2 ? '<span style="position:absolute;bottom:0;right:0;width:12px;height:12px;background:#00e676;border-radius:50%;border:2px solid #1a1a1a"></span>' : ''}
</div>
<div><b>${u.name}</b><br><small style="color:#888">${getStatus(u.lastSeen)}</small></div>
</div>
`).join('');
}

function ouvrirChat(nom){
currentChat = users.find(u=>u.name===nom);
document.getElementById('userListView').style.display='none';
document.getElementById('chatView').style.display='block';
document.getElementById('chatName').innerText = currentChat.name;
document.getElementById('chatPhoto').src = currentChat.photo;
afficherMessages();
}

function retour(){
document.getElementById('chatView').style.display='none';
document.getElementById('userListView').style.display='block';
}

function afficherMessages(){
let moi = "Junior";
let filtres = messages.filter(m=> (m.from===moi && m.to===currentChat.name) || (m.from===currentChat.name && m.to===moi));
document.getElementById('messages').innerHTML = filtres.map(m=>`<div class="msg ${m.from===moi?'me':''}">${m.text}</div>`).join('');
}

function envoyer(){
let txt = document.getElementById('msgInput').value;
if(!txt) return;
messages.push({from:"Junior", to:currentChat.name, text:txt});
document.getElementById('msgInput').value='';
afficherMessages();
}

function filtrer(q){
let f = users.filter(u=>u.name.toLowerCase().includes(q.toLowerCase()));
afficherUsers(f);
}

afficherUsers(users);
</script>
</body>
</html>
