<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blended</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Arial}
body{background:#000;color:#fff}
.auth{max-width:380px;margin:40px auto;padding:20px;background:#111;border-radius:16px}
.auth input{width:100%;padding:12px;margin:8px 0;border-radius:20px;border:none;background:#222;color:#fff}
.btn{padding:10px 18px;border:none;border-radius:20px;font-weight:bold;cursor:pointer}
.btn-green{background:#00e676;color:#000;width:100%}
.header{position:sticky;top:0;z-index:10;background:#111;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover}
.feed{max-width:500px;margin:0 auto;padding-bottom:80px}
.post{background:#111;margin:10px;border-radius:16px;padding:12px;border:1px solid #222}
.post img{width:100%;border-radius:12px;margin-top:8px}
.post b{cursor:pointer}
.actions{display:flex;gap:15px;margin-top:8px;color:#aaa}
#chat{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #333;z-index:99;max-width:500px;margin:0 auto;width:100%;height:60vh;display:none;flex-direction:column}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth">
<img id="prev" src="https://i.pravatar.cc/100" style="width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 10px">
<input type="file" id="file" accept="image/*">
<h2 id="t" style="text-align:center;margin:10px 0">Créer compte</h2>
<input id="n" placeholder="Nom complet">
<input id="e" placeholder="Email">
<input id="p" type="password" placeholder="Mot de passe">
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="mode=='up'?signup():login()">Continuer</button>
<p style="text-align:center;margin-top:15px"><span onclick="toggle()" style="color:#00e676;cursor:pointer" id="tog">J'ai déjà un compte</span></p>
</div>

<!-- APP -->
<div id="app" style="display:none">
<div class="header">
<b style="font-size:20px">blended</b>
<div style="display:flex;gap:10px;align-items:center">
<img id="myAv" class="avatar" src=""><b id="myName"></b>
<button onclick="logout()" class="btn" style="background:#222;color:#fff">Sortir</button>
</div>
</div>
<div class="feed">
<div class="post" style="display:flex;gap:8px">
<input id="txt" placeholder="Quoi de neuf?" style="flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff">
<button onclick="publier()" class="btn btn-green">Poster</button>
</div>
<div id="feed"></div>
</div>
</div>

<!-- CHAT MODAL - C'EST L'IB ICI -->
<div id="chat" style="display:none;position:fixed;flex-direction:column">
<div style="padding:10px;background:#222;display:flex;justify-content:space-between;align-items:center">
<b id="chatTitle">IB</b><span onclick="document.getElementById('chat').style.display='none'" style="cursor:pointer;padding:5px 10px;background:#333;border-radius:10px">X</span>
</div>
<div id="chatMsgs" style="height:300px;overflow-y:auto;padding:10px;display:flex;flex-direction:column"></div>
<div style="display:flex;padding:8px;gap:8px;background:#111">
<input id="chatInput" placeholder="Message..." style="flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff">
<button onclick="sendMsg()" class="btn btn-green">Envoyer</button>
</div>
</div>

<script>
let mode="up", users=JSON.parse(localStorage.getItem('users')||'[]'), posts=JSON.parse(localStorage.getItem('posts')||'[]'), cur=JSON.parse(localStorage.getItem('blended_cur')||'null'), curChat=null, msgs=JSON.parse(localStorage.getItem('blended_msgs')||'[]'), myAvatar="https://i.pravatar.cc/100"

document.getElementById('file').addEventListener('change',e=>{
  let r=new FileReader(); r.onload=()=>{myAvatar=r.result; document.getElementById('prev').src=myAvatar}; r.readAsDataURL(e.target.files[0])
})

function toggle(){if(mode=="up"){mode="in";document.getElementById('t').innerText="Connexion";document.getElementById('n').style.display='none';document.getElementById('tog').innerText="Créer un compte"}else{mode="up";document.getElementById('t').innerText="Créer compte";document.getElementById('n').style.display='block';document.getElementById('tog').innerText="J'ai déjà un compte"}}

function signup(){let n=document.getElementById('n').value,e=document.getElementById('e').value,p=document.getElementById('p').value;if(!n||!e||!p)return alert('Remplis tout');users.push({n,e,p,av:myAvatar});localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('blended_cur',JSON.stringify({n,e,av:myAvatar}));showApp()}
function login(){let e=document.getElementById('e').value,p=document.getElementById('p').value;let u=users.find(u=>u.e==e&&u.p==p);if(!u)return alert('Email ou pass faux');localStorage.setItem('blended_cur',JSON.stringify(u));showApp()}
function showApp(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';let c=JSON.parse(localStorage.getItem('blended_cur'));document.getElementById('myName').innerText=c.n;document.getElementById('myAv').src=c.av||myAvatar;render()}

function render(){let h="";posts.slice().reverse().forEach((post,iReal)=>{
  let i=posts.length-1-posts.slice().reverse().indexOf(post)
  h+=`<div class="post"><div style="display:flex;gap:8px;align-items:center"><img src="${post.av}" class="avatar"><b onclick="chatWith('${post.uid}')" style="color:#00e676">${post.uid}</b></div><div style="margin-top:8px">${post.txt}</div>${post.img?`<img src="${post.img}">`:''}<div class="actions"><span onclick="like(${posts.indexOf(post)})">❤️ ${post.likes||0}</span><span onclick="commenter(${posts.indexOf(post)})">💬 ${post.comments?.length||0}</span><span onclick="chatWith('${post.uid}')">📩 IB</span></div></div>`
});document.getElementById('feed').innerHTML=h}

function publier(){let t=document.getElementById('txt');if(!t.value.trim())return;let cur=JSON.parse(localStorage.getItem('blended_cur'));savePost(t.value,'');t.value=''}
function savePost(txt,img){let cur=JSON.parse(localStorage.getItem('blended_cur'));posts.push({uid:cur.n,txt,img,av:cur.av,likes:0,comments:[]});localStorage.setItem('posts',JSON.stringify(posts));render()}
function like(i){posts[i].likes=(posts[i].likes||0)+1;localStorage.setItem('posts',JSON.stringify(posts));render()}
function commenter(i){let t=prompt("Ton commentaire:");if(!t)return;posts[i].comments=posts[i].comments||[];posts[i].comments.push(t);localStorage.setItem('posts',JSON.stringify(posts));render()}

// --- ICI LE SYSTEME IB QUE TU VOULAIS ---
function chatWith(name){
  let cur=JSON.parse(localStorage.getItem('blended_cur'))
  if(name===cur.n) return alert("C'est toi même!")
  curChat=name;
  document.getElementById('chat').style.display='flex';
  document.getElementById('chatTitle').innerText='IB avec '+name;
  renderChat();
}
function sendMsg(){
  let t=document.getElementById('chatInput');if(!t.value.trim()||!curChat)return;
  let cur=JSON.parse(localStorage.getItem('blended_cur'));
  msgs.push({from:cur.n,to:curChat,txt:t.value,time:Date.now()});
  localStorage.setItem('blended_msgs',JSON.stringify(msgs));
  t.value='';renderChat();
}
function renderChat(){
  let cur=JSON.parse(localStorage.getItem('blended_cur'));
  let f=msgs.filter(m=>(m.from===cur.n&&m.to===curChat)||(m.from===curChat&&m.to===cur.n));
  let h="";f.forEach(m=>{
    let me=m.from===cur.n;
    h+=`<div style="margin:6px 0;padding:10px 14px;border-radius:18px;max-width:75%;${me?'margin-left:auto;background:#00e676;color:#000':'background:#222'}">${m.txt}</div>`
  });
  document.getElementById('chatMsgs').innerHTML=h;
  document.getElementById('chatMsgs').scrollTop=99999;
}
function logout(){localStorage.removeItem('blended_cur');location.reload()}
if(cur)showApp();
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()})
</script>
</body></html>
