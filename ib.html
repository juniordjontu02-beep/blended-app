<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;font-family:Arial}
body{background:#000;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{padding:12px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.header a{color:#fff;text-decoration:none;font-size:20px;padding:5px 10px}
.header img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.chat-box{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#222;padding:10px 14px;border-radius:18px;max-width:75%;word-wrap:break-word}
.msg.me{background:#005c4b;margin-left:auto;color:#fff}
.input-area{padding:10px;background:#111;border-top:1px solid #222;display:flex;gap:8px;position:sticky;bottom:0}
input{flex:1;padding:12px;border-radius:22px;border:none;background:#222;color:#fff;outline:none}
button{background:#00e676;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<a href="index.html">←</a>
<img id="av" src="">
<b id="title">IB</b>
</div>
<div class="chat-box" id="box"></div>
<div class="input-area">
<input id="inp" placeholder="Message privé...">
<button onclick="send()">Envoyer</button>
</div>
<script>
let params = new URLSearchParams(location.search)
let to = params.get('user')
let cur = JSON.parse(localStorage.getItem('blended_cur')||'null')
if(!cur) location.href='login.html'
if(!to){ document.getElementById('title').innerText='Choisis un user'; }

let users = JSON.parse(localStorage.getItem('users')||'[]')
let u = users.find(x=>x.n===to)
if(u && u.av) document.getElementById('av').src = u.av
document.getElementById('title').innerText = to

let msgs = JSON.parse(localStorage.getItem('blended_msgs')||'[]')

function render(){
  let f = msgs.filter(m=>(m.from===cur.n && m.to===to) || (m.from===to && m.to===cur.n))
  let h=''
  f.forEach(m=>{
    h+=`<div class="msg ${m.from===cur.n?'me':''}">${m.txt}</div>`
  })
  document.getElementById('box').innerHTML = h || '<p style="text-align:center;color:#555;margin-top:30px">Début de la conversation avec '+to+'<br>Envoie le premier message 👋</p>'
  document.getElementById('box').scrollTop = 999999
}
function send(){
  let i = document.getElementById('inp')
  if(!i.value.trim()) return
  msgs.push({from:cur.n,to:to,txt:i.value,time:Date.now()})
  localStorage.setItem('blended_msgs',JSON.stringify(msgs))
  i.value=''
  render()
}
render()
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send()})
</script>
</body>
</html>
