<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Blended</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;display:flex;flex-direction:column;height:100vh}
.top{padding:14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e1e1e}
.ava{width:40px;height:40px;background:linear-gradient(135deg,#a78bfa,#ec4899);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:75%;padding:12px 16px;border-radius:20px;font-size:15px}
.me{align-self:flex-end;background:#a78bfa;border-bottom-right-radius:6px}
.other{align-self:flex-start;background:#1e1e1e;border-bottom-left-radius:6px}
.bottom{padding:12px;display:flex;gap:10px;border-top:1px solid #1e1e1e}
.bottom input{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;padding:14px;border-radius:24px;color:#fff;outline:none}
.bottom button{width:48px;height:48px;background:#a78bfa;border:0;border-radius:50%;color:#fff;font-size:20px}
</style></head>
<body>
<div class="top"><div class="ava">A</div><b>Aminata</b></div>
<div id="msgs"></div>
<div class="bottom"><input id="input" placeholder="Écris un message..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div>
<script>
const msgs=document.getElementById('msgs');
const input=document.getElementById('input');
function add(text,me){let d=document.createElement('div');d.className='bubble '+(me?'me':'other');d.innerText=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;save();}
function save(){localStorage.setItem('chat_aminata',msgs.innerHTML);}
function load(){let s=localStorage.getItem('chat_aminata');if(s){msgs.innerHTML=s;}else{add('Hey! ça va? 😊',false);}}
function send(){if(!input.value.trim())return;add(input.value,true);input.value='';setTimeout(()=>{add('D\'accord 😊',false);},800);}
load();
</script>
</body></html>
