<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blended V4 - Search Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI}
body{background:#000;display:flex;justify-content:center;height:100vh;overflow:hidden}
.app{width:100%;max-width:430px;background:#0d0d0f;display:flex;flex-direction:column;height:100vh}
.header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#131316;border-bottom:1px solid #222}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;color:#fff}
.logo b{width:36px;height:36px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center}
.btnAdd{background:#a78bfa;color:#000;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:900;border:0;cursor:pointer}
.searchBar{padding:8px 12px;background:#131316;border-bottom:1px solid #222;display:flex;gap:8px}
.searchBar input{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;padding:10px 14px;border-radius:20px;color:#fff;outline:none;font-size:14px}
.stories{display:flex;gap:12px;padding:12px;overflow-x:auto;background:#131316;border-bottom:1px solid #222}
.stories::-webkit-scrollbar{display:none}
.s-item{flex:0 0 64px;text-align:center;cursor:pointer}
.s-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#a78bfa,#ec4899,#f59e0b);display:flex;align-items:center;justify-content:center}
.s-ava{width:100%;height:100%;border-radius:50%;background:#1e1e1e;border:2px solid #131316;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff}
.s-add{background:#2a2a2a !important;border:1.5px dashed #555 !important}
.s-item span{font-size:10px;color:#aaa;margin-top:4px;display:block}
.chats{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.chat{padding:10px;display:flex;gap:12px;background:#131316;border-radius:16px;cursor:pointer}
.c-ava{width:46px;height:46px;border-radius:50%;background:#222;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden}
.c-ava img{width:100%;height:100%;object-fit:cover}
.c-info{flex:1;min-width:0;color:#fff}
.c-info b{font-size:15px}
.c-info p{font-size:13px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:#777;text-align:right}
.badge{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:4px;margin-left:auto}
.b-blue{background:#3b82f6}.b-green{background:#22c55e}
#chatView{flex:1;display:none;flex-direction:column;height:100vh}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;cursor:pointer}
.me{align-self:flex-end;background:#a78bfa;color:#000;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:4px}
.edited{font-size:9px;opacity:.6;margin-left:6px}
.bottom{padding:10px;background:#131316;border-top:1px solid #222;display:flex;gap:8px;align-items:center;position:sticky;bottom:0}
.bottom input{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;padding:12px 16px;border-radius:24px;color:#fff;outline:none}
.iconBtn{width:42px;height:42px;border-radius:50%;border:0;font-size:18px;cursor:pointer}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;padding:20px}
.menuBox{background:#1e1e1e;width:100%;max-width:430px;border-radius:20px;padding:10px}
.mOpt{padding:16px;text-align:center;border-bottom:1px solid #2a2a2a;cursor:pointer;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo"><b>B</b>Blended</div><div style="display:flex;gap:8px"><button class="btnAdd" onclick="addRealContact()">+ Contact</button><span onclick="showList()" style="color:#fff">↩️</span></div></div>

<div id="listView" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
<!-- BARRE DE RECHERCHE AJOUTEE -->
<div class="searchBar"><input id="searchInput" placeholder="🔍 Rechercher un contact..." oninput="doSearch()"></div>
<div class="stories" id="stories"></div>
<div class="chats" id="chatList"></div>
</div>

<div id="chatView"><div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center;background:#131316;color:#fff"><div id="cAva" style="width:36px;height:36px;border-radius:50%;background:#a78bfa;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000"></div><b id="cName"></b><span onclick="showList()" style="margin-left:auto;cursor:pointer">✕</span></div><div id="msgs"></div><div class="bottom"><input id="text" placeholder="Écris un message..." autocomplete="off"><button id="micBtn" class="iconBtn" onclick="toggleVoice()" style="background:#a78bfa">🎤</button><button class="iconBtn" onclick="sendText()" style="background:#fff">➤</button></div></div>
</div>

<div id="menu" onclick="if(event.target==this)closeMenu()"><div class="menuBox"><div class="mOpt" onclick="doEdit()">✏️ Modifier / Remplacer</div><div class="mOpt" onclick="doDelete()" style="color:#ef4444">🗑️ Supprimer</div><div class="mOpt" onclick="doCopy()">📋 Copier</div><div class="mOpt" onclick="closeMenu()" style="color:#aaa">Annuler</div></div></div>

<script>
let users = JSON.parse(localStorage.getItem('real_contacts')||'null') || [
{name:"Alex",msg:"You're on for tomorrow? 😎",time:"2m",badge:"2",col:"b-blue",img:"https://i.pravatar.cc/100?img=15"},
{name:"Sam",msg:"Sent a photo",time:"10m",badge:"✓",col:"b-green",img:"https://i.pravatar.cc/100?img=5"},
{name:"Jordan",msg:"Seen the new design? I love it 🔥",time:"15m",img:"https://i.pravatar.cc/100?img=12"},
{name:"Vanne",msg:"Salut Bafoussam ❤️",time:"3h",img:"https://i.pravatar.cc/100?img=16"},
];
let stories=JSON.parse(localStorage.getItem('b_stories')||'[{"name":"Vanne","txt":"Salut Bafoussam ❤️"}]');
let current=null, selectedBubble=null, isRec=false, mediaRecorder, audioChunks=[], startT;
function save(){localStorage.setItem('real_contacts',JSON.stringify(users));}
function render(list=users){
 let sC=document.getElementById('stories');sC.innerHTML='';
 let add=document.createElement('div');add.className='s-item';add.innerHTML='<div class="s-ring s-add"><div class="s-ava">+</div></div><span>Add</span>';add.onclick=()=>{let t=prompt('Texte story:');if(t){stories.unshift({name:"Junior",txt:t});localStorage.setItem('b_stories',JSON.stringify(stories));render();}};sC.appendChild(add);
 stories.forEach(s=>{let d=document.createElement('div');d.className='s-item';d.innerHTML=`<div class="s-ring"><div class="s-ava">${s.name.slice(0,2).toUpperCase()}</div></div><span>${s.name}</span>`;d.onclick=()=>{alert(s.txt);};sC.appendChild(d);});
 let cC=document.getElementById('chatList');cC.innerHTML='';
 list.forEach((u,i)=>{let d=document.createElement('div');d.className='chat';d.innerHTML=`<div class="c-ava"><img src="${u.img}"></div><div class="c-info"><b>${u.name}</b><p>${u.msg}</p></div><div class="meta">${u.time}<div class="badge ${u.col}">${u.badge||''}</div></div>`;d.onclick=()=>openChat(u);cC.appendChild(d);});
}
function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase();let filtered=users.filter(u=>u.name.toLowerCase().includes(q)||u.msg.toLowerCase().includes(q));render(filtered);}
function addRealContact(){let name=prompt("Nom du vrai contact:");if(!name)return;let msg=prompt("Dernier message:")||"Nouveau";users.unshift({name:name,msg:msg,time:"maint.",img:`https://i.pravatar.cc/100?u=${name}${Date.now()}`,badge:"1",col:"b-blue"});save();render();}
function openChat(u){current=u;document.getElementById('listView').style.display='none';document.getElementById('chatView').style.display='flex';document.getElementById('cName').innerText=u.name;document.getElementById('cAva').innerText=u.name.slice(0,2).toUpperCase();document.getElementById('msgs').innerHTML=`<div class="bubble other">${u.msg}</div>`;}
function showList(){document.getElementById('listView').style.display='flex';document.getElementById('chatView').style.display='none';}
function sendText(){let t=document.getElementById('text');if(!t.value.trim())return;let m=document.getElementById('msgs');let b=document.createElement('div');b.className='bubble me';b.innerText=t.value;b.onclick=()=>{selectedBubble=b;document.getElementById('menu').style.display='flex';};m.appendChild(b);t.value='';m.scrollTop=m.scrollHeight;}
function closeMenu(){document.getElementById('menu').style.display='none';}
function doEdit(){let cur=selectedBubble.innerText.replace(" (modifié)","");let n=prompt("Remplacer par:",cur);if(n)selectedBubble.innerHTML=n+'<span class="edited"> (modifié)</span>';closeMenu();}
function doDelete(){if(confirm("Supprimer?"))selectedBubble.remove();closeMenu();}
function doCopy(){navigator.clipboard.writeText(selectedBubble.innerText);closeMenu();}
async function toggleVoice(){let btn=document.getElementById('micBtn');if(!isRec){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);let sec=Math.round((Date.now()-startT)/1000);let m=document.getElementById('msgs');let b=document.createElement('div');b.className='bubble me';b.innerHTML=`🎤 <audio controls src="${url}" style="width:120px"></audio> ${sec}s`;b.onclick=()=>{selectedBubble=b;document.getElementById('menu').style.display='flex';};m.appendChild(b);m.scrollTop=m.scrollHeight;s.getTracks().forEach(t=>t.stop());};mediaRecorder.start();isRec=true;startT=Date.now();btn.style.background='#ef4444';btn.innerText='⏹️';}catch(e){alert('Autorise micro');}}else{mediaRecorder.stop();isRec=false;btn.style.background='#a78bfa';btn.innerText='🎤';}}
render();
</script>
</body>
</html>
