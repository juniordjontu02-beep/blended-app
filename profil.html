<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil - BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;min-height:100vh;padding-bottom:80px}
.header{padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{width:45px;height:45px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border-radius:14px}
.card{margin:15px;background:#111;border-radius:32px;overflow:hidden;border:1px solid #222}
.photo{width:100%;height:420px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#000}
.info{padding:20px}
.name{font-size:28px;font-weight:900}
.city{color:#888;margin:4px 0 14px}
.quote{background:#1a1a1a;padding:16px;border-radius:16px;color:#ccc;font-style:italic}
.stats{display:flex;gap:10px;margin-top:18px}
.stat{flex:1;background:#1a1a1a;padding:14px;border-radius:16px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{color:#888;font-size:12px}
.actions{padding:20px;display:flex;flex-direction:column;gap:12px}
.btn{padding:18px;border-radius:28px;border:none;font-weight:900;font-size:16px;cursor:pointer}
.btn-green{background:#00ff88;color:#000}
.btn-white{background:#fff;color:#000}
.btn-dark{background:#222;color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.nav-item{text-align:center;color:#666;font-size:12px;text-decoration:none}
.nav-item.active{color:#fff}
</style>
</head><body>
<div class="header">
<div class="logo">B</div>
<h3>Mon Profil</h3>
<span style="color:#00ff88;font-size:12px;font-weight:700">● LIVE</span>
</div>

<div class="card">
<div class="photo" id="avatar">B</div>
<div class="info">
<div class="name" id="name">Djontu Junior</div>
<div class="city" id="city">Bafoussam, Cameroun</div>
<div class="quote" id="quote">Rien n'est impossible et rien ne s'obtient facilement</div>
<div class="stats">
<div class="stat"><b id="likes">2</b><span>Likes</span></div>
<div class="stat"><b>18</b><span>Ans</span></div>
<div class="stat"><b style="color:#00ff88">LIVE</b><span>Statut</span></div>
</div>
</div>
</div>

<div class="actions">
<button class="btn btn-green" onclick="shareWA()">📲 Partager sur WhatsApp</button>
<button class="btn btn-white" onclick="copyLink()">🔗 Copier le lien de BLENDED</button>
<button class="btn btn-dark" onclick="location.href='inscription.html'">✏️ Modifier mon profil</button>
</div>

<div class="bottom-nav">
<a href="index.html" class="nav-item">🏠<br>Accueil</a>
<a href="chat.html" class="nav-item">💬<br>Chat</a>
<a href="ib.html" class="nav-item">🟨<br>IB</a>
<a href="profil.html" class="nav-item active">👤<br>Profil</a>
</div>

<script>
// Charge ton vrai profil depuis Firebase
async function load(){
try{
let res=await fetch('https://blended-b75d3-default-rtdb.firebaseio.com/users.json');
let data=await res.json();
if(data){
let users=Object.values(data);
let u=users.find(x=> (x.name||'').toLowerCase().includes('junior')) || users[0];
if(u){
document.getElementById('name').innerText=u.name||'Djontu Junior';
document.getElementById('city').innerText=(u.city||'Bafoussam')+', Cameroun';
document.getElementById('quote').innerText=u.quote||'Rien n\'est impossible et rien ne s\'obtient facilement';
document.getElementById('avatar').innerText=(u.name||'B')[0].toUpperCase();
}
let chatsRes=await fetch('https://blended-b75d3-default-rtdb.firebaseio.com/chats/blended_global.json');
let chats=await chatsRes.json();
if(chats) document.getElementById('likes').innerText=Object.keys(chats).length;
}
}catch(e){}
}

function shareWA(){
let text=`🔥 Découvre BLENDED - L'app de Bafoussam créée par Djontu Junior, 18 ans!\n\nRien n'est impossible et rien ne s'obtient facilement\n\n👉 Rejoins-nous: https://juniordjontu02-beep.github.io/blended-app/`;
let url=`https://wa.me/?text=${encodeURIComponent(text)}`;
window.open(url,'_blank');
}

function copyLink(){
let link='https://juniordjontu02-beep.github.io/blended-app/';
navigator.clipboard.writeText(link).then(()=>alert('✅ Lien copié! Envoie-le sur WhatsApp!'));
}

load();
</script>
</body></html>
