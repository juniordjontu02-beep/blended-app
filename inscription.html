<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#111;padding:25px;border-radius:16px;width:90%;max-width:360px;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border-radius:22px;border:none;background:#222;color:#fff;box-sizing:border-box}
.btn{background:#00e676;color:#000;border:none;padding:12px;width:100%;border-radius:22px;font-weight:bold;margin-top:10px;cursor:pointer}
img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
<img id="prev" src="https://i.pravatar.cc/100">
<input type="file" id="file" accept="image/*">
<h2>Créer compte</h2>
<input id="n" placeholder="Nom complet">
<input id="e" placeholder="Email">
<input id="p" type="password" placeholder="Mot de passe">
<button class="btn" onclick="signup()">Créer et Entrer</button>
<p style="margin-top:15px;font-size:14px">Déjà un compte? <span onclick="login()" style="color:#00e676;cursor:pointer">Se connecter</span></p>
</div>
<script>
let avatar="https://i.pravatar.cc/100"
document.getElementById('file').addEventListener('change',e=>{
  let r=new FileReader();r.onload=()=>{avatar=r.result;document.getElementById('prev').src=avatar};r.readAsDataURL(e.target.files[0])
})
function signup(){
  let n=document.getElementById('n').value,e=document.getElementById('e').value,p=document.getElementById('p').value
  if(!n||!e||!p) return alert('Remplis tout')
  let users=JSON.parse(localStorage.getItem('users')||'[]')
  if(users.find(u=>u.e===e)) return alert('Email déjà utilisé')
  let u={n,e,p,av:avatar}
  users.push(u);localStorage.setItem('users',JSON.stringify(users))
  localStorage.setItem('blended_cur',JSON.stringify(u))
  location.href='index.html'
}
function login(){
  let e=document.getElementById('e').value,p=document.getElementById('p').value
  let users=JSON.parse(localStorage.getItem('users')||'[]')
  let u=users.find(u=>u.e===e&&u.p===p)
  if(!u) return alert('Email ou mot de passe faux')
  localStorage.setItem('blended_cur',JSON.stringify(u))
  location.href='index.html'
}
</script>
</body>
</html>
