<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blended - Inscription</title>
<style>body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#111;padding:25px;border-radius:16px;width:90%;max-width:360px;text-align:center}input{width:100%;padding:12px;margin:8px 0;border-radius:22px;border:none;background:#222;color:#fff;box-sizing:border-box}.btn{background:#00e676;color:#000;border:none;padding:12px;width:100%;border-radius:22px;font-weight:bold;cursor:pointer;margin-top:10px}img{width:80px;height:80px;border-radius:50%;object-fit:cover}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
<img id="prev" src="https://i.pravatar.cc/100">
<input type="file" id="file" accept="image/*">
<h2>Créer compte</h2>
<input id="n" placeholder="Nom complet">
<input id="e" placeholder="Email">
<input id="p" type="password" placeholder="Mot de passe">
<button class="btn" onclick="signup()">Créer et Entrer</button>
<p onclick="toggle()" style="color:#00e676;margin-top:15px;cursor:pointer;font-size:14px" id="tog">Déjà un compte? Se connecter</p>
</div>
<script>
const supa = supabase.createClient('https://zdfxuhjobcbfzymejkcm.supabase.co','sb_publishable_KPfVjYwPXE12BZKkjYDkAQ_QRjDEZRy');
let av="https://i.pravatar.cc/100", isLogin=false;
document.getElementById('file').onchange=e=>{let r=new FileReader();r.onload=()=>{av=r.result;document.getElementById('prev').src=av};r.readAsDataURL(e.target.files[0])};
function toggle(){isLogin=!isLogin;document.getElementById('tog').innerText=isLogin?"Créer un compte":"Déjà un compte? Se connecter";document.querySelector('.btn').innerText=isLogin?"Se connecter":"Créer et Entrer"}
async function signup(){
  let n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value.trim();
  if(!e||!p) return alert('Remplis email et pass');
  if(isLogin){
    let {data,error}=await supa.from('users').select().eq('e',e).eq('p',p).single();
    if(error||!data) return alert('Email ou pass faux');
    localStorage.setItem('blended_cur',JSON.stringify(data)); location.href='index.html';
  } else {
    if(!n) return alert('Mets ton nom');
    let {data,error}=await supa.from('users').insert({n,e,p,av}).select().single();
    if(error) return alert(error.message);
    localStorage.setItem('blended_cur',JSON.stringify(data)); location.href='index.html';
  }
}
</script>
</body>
</html>
