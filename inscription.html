<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:black;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px">
<div style="width:100%;max-width:380px;background:#18181b;border-radius:40px;padding:28px;border:1px solid #27272a">
<h1 style="color:white;font-weight:900;font-size:32px;text-align:center">BLENDED<span style="color:#8b5cf6">.</span></h1>
<input id="nom" placeholder="Ton nom complet" style="width:100%;background:#27272a;color:white;padding:16px;border-radius:16px;margin-top:24px;border:0">
<input id="contact" placeholder="Numéro ou Email" style="width:100%;background:#27272a;color:white;padding:16px;border-radius:16px;margin-top:12px;border:0">
<input id="naissance" type="date" style="width:100%;background:#27272a;color:white;padding:16px;border-radius:16px;margin-top:12px;border:0">
<select id="genre" style="width:100%;background:#27272a;color:white;padding:16px;border-radius:16px;margin-top:12px;border:0">
<option value="">Genre</option><option>Homme</option><option>Femme</option><option>Autre</option>
</select>
<button onclick="go()" style="width:100%;background:white;color:black;font-weight:900;padding:16px;border-radius:999px;margin-top:20px">CREER MON COMPTE</button>
<p id="msg" style="text-align:center;color:#4ade80;margin-top:12px"></p>
<a href="chat.html" style="display:block;text-align:center;color:#71717a;font-size:12px;margin-top:16px">Va au Chat IB →</a>
</div>
<script>
function go(){
let n=document.getElementById('nom').value;
let c=document.getElementById('contact').value;
let d=document.getElementById('naissance').value;
let g=document.getElementById('genre').value;
if(!n||!c||!d||!g){document.getElementById('msg').innerHTML='⚠️ Remplis tout';return;}
localStorage.setItem('blended_user',JSON.stringify({nom:n,contact:c,naissance:d,genre:g}));
document.getElementById('msg').innerHTML='✅ Bienvenue '+n;
setTimeout(()=>location.href='chat.html',1000);
}
</script></body></html>
