<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription - BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial}
.box{background:#fff;width:100%;max-width:400px;border-radius:32px;padding:28px}
.b-logo{text-align:center;font-size:60px;font-weight:900;margin-bottom:10px}
h1{text-align:center;font-size:24px}.sub{text-align:center;color:#777;font-size:14px;margin:8px 0 20px}
input,textarea{width:100%;padding:15px;margin-top:6px;margin-bottom:14px;border:1px solid #eee;border-radius:12px;font-size:16px;background:#f9f9f9}
label{font-weight:800;font-size:12px}
.btn{width:100%;padding:18px;border:none;border-radius:30px;background:#00ff88;font-weight:900;font-size:18px;margin-top:10px}
</style></head><body>
<div class="box">
<div class="b-logo">B</div>
<h1>Rejoins BLENDED</h1>
<p class="sub">Crée ta carte</p>
<label>NOM</label><input id="name" placeholder="Djontu Junior">
<label>VILLE</label><input id="city" placeholder="Bafoussam">
<label>AGE</label><input id="age" type="number" placeholder="18">
<label>PHRASE</label><textarea id="quote" placeholder="Ta phrase..."></textarea>
<button class="btn" onclick="go()">S'INSCRIRE →</button>
<p style="text-align:center;margin-top:12px;font-size:12px"><a href="index.html" style="color:#000;font-weight:700">Retour au swipe</a></p>
</div>
<script>
function go(){
let n=document.getElementById('name').value;
let c=document.getElementById('city').value;
let a=document.getElementById('age').value;
let q=document.getElementById('quote').value;
if(!n||!c||!a||!q){alert('Remplis tout!');return;}
let p={name:n,city:c,age:a,quote:q};
localStorage.setItem('myProfile',JSON.stringify(p));
alert('Inscription réussie BOSS! 🔥');
location.href='index.html';
}
</script>
</body></html>
