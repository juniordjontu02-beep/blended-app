<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:white;min-height:100vh;padding-bottom:90px}
.header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;background:#111}
.logo-icon{width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.form{padding:24px 20px;max-width:400px;margin:0 auto}
.form h1{font-size:28px;font-weight:900;margin-bottom:6px}
.form p{color:#666;font-size:13px;margin-bottom:24px}
.label{font-size:12px;color:#888;margin:16px 0 8px;display:block;letter-spacing:1px}
.input{width:100%;background:#111;border:1px solid #222;padding:16px;border-radius:12px;color:white;outline:none;font-size:14px}
.input:focus{border-color:#fff}
.btn{width:100%;background:#fff;color:#000;border:none;padding:18px;border-radius:14px;font-weight:900;margin-top:28px;font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#fff}
.ok{background:#00ff88;color:#000;padding:12px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;display:none;margin-top:16px}
</style>
</head>
<body>
<div class="header">
<div class="logo-icon"><svg width="22" height="22" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="white"/><path d="M22 15 L55 15 Q75 15 75 35 Q75 50 55 50 Q75 50 78 70 Q78 88 55 88 L22 88 Z" fill="black"/></svg></div>
<b style="letter-spacing:2px">BLENDED</b>
</div>

<div class="form">
<h1>Ton profil anonyme</h1>
<p>Pas de photo, pas de numéro. Juste toi.</p>

<label class="label">PSEUDO</label>
<input id="pseudo" class="input" placeholder="Ex: BafBoy23">

<label class="label">VILLE</label>
<input id="ville" class="input" placeholder="Bafoussam">

<label class="label">TU CHERCHES QUOI?</label>
<input id="cherche" class="input" placeholder="Discussion, rencontre...">

<button class="btn" onclick="save()">ENREGISTRER →</button>
<div id="ok" class="ok">✅ Profil enregistré! Il reste dans ton téléphone.</div>
</div>

<div class="nav">
<a href="index.html">🏠<br>Accueil</a>
<a href="chat.html">💬<br>Chat</a>
<a href="ib.html">✉️<br>IB</a>
<a class="active">👤<br>Profil</a>
</div>

<script>
document.getElementById('pseudo').value = localStorage.getItem('blended_pseudo') || '';
document.getElementById('ville').value = localStorage.getItem('blended_ville') || 'Bafoussam';

function save(){
 let p=document.getElementById('pseudo').value;
 let v=document.getElementById('ville').value;
 localStorage.setItem('blended_pseudo', p);
 localStorage.setItem('blended_ville', v);
 document.getElementById('ok').style.display='block';
 setTimeout(()=>{window.location.href='index.html'},1200);
}
</script>
</body>
</html>
