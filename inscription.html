<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blended - Inscription WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial}
body{background:#fff}
.top{background:#075e54;padding:15px;color:#fff;display:flex;gap:15px;align-items:center}
.top h2{font-size:18px;font-weight:400}
.content{padding:25px}
.content p{color:#667781;font-size:14px;text-align:center;margin-bottom:20px}
.label{color:#008069;font-size:13px;margin:20px 0 5px;display:block}
.box{display:flex;gap:10px;border-bottom:2px solid #008069;padding:8px 0}
.box select,.box input{border:none;flex:1;font-size:16px;outline:none;background:none}
.btn{position:fixed;bottom:20px;left:5%;width:90%;background:#25d366;color:#fff;border:none;padding:15px;border-radius:25px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<div class="top"><span onclick="history.back()">‹</span><h2>Vérification du numéro</h2></div>
<div class="content">
<p>On va vérifier ton numéro. Entre ton numéro WhatsApp.</p>
<span class="label">Cameroun</span>
<div class="box"><select><option>🇨🇲 +237</option></select><input id="contact" placeholder="6 12 34 56 78"></div>
<span class="label">Ton nom complet</span>
<div class="box"><input id="nom" placeholder="Ex: Junior"></div>
<span class="label">Date de naissance</span>
<div class="box"><input id="naissance" type="date"></div>
<span class="label">Genre</span>
<div class="box"><select id="genre"><option value="">Genre</option><option>Homme</option><option>Femme</option></select></div>
<p id="msg" style="text-align:center;margin-top:20px;color:green"></p>
</div>
<button class="btn" onclick="go()">SUIVANT</button>
<script>
function go(){
 let n=document.getElementById('nom').value
 let c=document.getElementById('contact').value
 let d=document.getElementById('naissance').value
 let g=document.getElementById('genre').value
 if(!n||!c||!d||!g){document.getElementById('msg').innerHTML='Remplis tout!';return}
 localStorage.setItem('blended_user',JSON.stringify({nom:n,contact:c,naissance:d,genre:g}))
 document.getElementById('msg').innerHTML='✅ Vérifié! Redirection...'
 setTimeout(()=>location.href='chat.html',1000)
}
</script>
</body>
</html>
