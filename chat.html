<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.msg{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px}
.msg.other{background:#1e1e1e;align-self:flex-start}
.msg.me{background:white;color:black;align-self:flex-end;font-weight:500}
.input-area{background:#111;border-top:1px solid #222;padding:12px;display:flex;gap:10px;position:fixed;bottom:0;left:0;right:0}
.input-area input{flex:1;background:#1e1e1e;border:none;padding:14px 18px;border-radius:25px;color:white;outline:none}
.input-area button{background:#25D366;border:none;width:46px;height:46px;border-radius:50%;color:white;font-size:20px}
.wa-tag{background:#25D3661A;border:1px solid #25D366;color:#25D366;padding:8px;border-radius:10px;text-align:center;font-size:11px;margin:10px}
</style>
</head>
<body>
<div class="header">
<div class="logo-box">
<div class="logo-icon">
<svg width="24" height="24" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="white"/><path d="M22 15 L55 15 Q75 15 75 35 Q75 50 55 50 Q75 50 78 70 Q78 88 55 88 L22 88 Z" fill="black"/></svg>
</div>
<b style="letter-spacing:2px">BLENDED</b>
</div>
<div style="color:#00ff88;font-size:12px">● 1 243 en ligne</div>
</div>

<div class="chat" id="chatBox">
<div class="msg other">Salut tu es de Bafoussam?</div>
<div class="msg me">Oui et toi?</div>
<div class="wa-tag">💬 Tes messages partent direct sur WhatsApp</div>
</div>

<div class="input-area">
<input type="text" id="msgInput" placeholder="Écris en IB...">
<button onclick="sendWA()">↑</button>
</div>

<script>
function sendWA(){
let t=document.getElementById('msgInput').value.trim();
if(!t)return;
let m="Salut! Vu sur BLENDED: "+t;
window.open("https://wa.me/?text="+encodeURIComponent(m),"_blank");
let box=document.getElementById('chatBox');
let d=document.createElement('div');d.className='msg me';d.textContent=t+" ✅";
box.appendChild(d);document.getElementById('msgInput').value='';
box.scrollTop=box.scrollHeight;
}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendWA();});
</script>
</body>
</html>
