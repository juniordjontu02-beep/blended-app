<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLENDED - Chat Anonyme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#111;border-bottom:1px solid #222;padding:15px;display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:16px}
.online{color:#00ff88;font-size:12px}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4}
.msg.other{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:white;color:black;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.input-area{background:#111;border-top:1px solid #222;padding:12px;display:flex;gap:10px}
.input-area input{flex:1;background:#1e1e1e;border:none;padding:14px 18px;border-radius:25px;color:white;outline:none}
.input-area button{background:white;color:black;border:none;width:45px;height:45px;border-radius:50%;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h2>Chat Anonyme</h2>
<div class="online">● 1 243 en ligne • Bafoussam</div>
</div>
<div class="chat">
<div class="msg other">Salut ça va? Tu es de Bafoussam?</div>
<div class="msg me">Oui et toi?</div>
<div class="msg other">Moi aussi, on s'écrit en IB?</div>
</div>
<div class="input-area">
<input type="text" placeholder="Écris un message...">
<button>↑</button>
</div>
</body>
</html>
