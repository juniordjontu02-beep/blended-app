<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - BLENDED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.msg{max-width:75%;padding:12px 16px;border-radius:18px;font-size:14px;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.msg.other{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:white;color:black;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.input-area{background:#111;border-top:1px solid #222;padding:12px;display:flex;gap:10px;position:fixed;bottom:0;left:0;right:0}
.input-area input{flex:1;background:#1e1e1e;border:none;padding:14px 18px;border-radius:25px;color:white;outline:none}
.input-area button{background:#fff;color:#000;border:none;width:46px;height:46px;border-radius:50%;font-weight:900;font-size:18px}
.small{font-size:10px;color:#666;margin-top:4px}
</style>
</head>
<body>
<div class="header">
<div class="logo-box">
<div class="logo-icon"><svg width="22" height="22" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="white"/><path d="M22 15 L55 15 Q75 15 75 35 Q75 50 55 50 Q75 50 78 70 Q78 88 55 88 L22 88 Z" fill="black"/></svg></div>
<b style="letter-spacing:2px">BLENDED</b>
</div>
<div style="color:#00ff88;font-size:12px">● En ligne</div>
</div>

<div class="chat" id="chatBox"></div>

<div class="input-area">
<input type="text" id="msgInput" placeholder="Écris en IB...">
<button onclick="send()">↑</button>
</div>

<script>
let msgs = JSON.parse(localStorage.getItem('blended_msgs') || '[]');
if(msgs.length==0){
  msgs = [
    {me:false,text:"Salut tu es de Bafoussam?"},
    {me:true,text:"Oui et toi?"}
  ];
}

function render(){
  let box=document.getElementById('chatBox');
  box.innerHTML='';
  msgs.forEach(m=>{
    let d=document.createElement('div');
    d.className='msg '+(m.me?'me':'other');
    d.textContent=m.text;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

function send(){
  let input=document.getElementById('msgInput');
  let t=input.value.trim();
  if(!t)return;
  msgs.push({me:true,text:t});
  localStorage.setItem('blended_msgs', JSON.stringify(msgs));
  render();
  input.value='';
  
  // Réponse auto après 1s pour faire vivant
  setTimeout(()=>{
    msgs.push({me:false,text:"Vu 👀"});
    localStorage.setItem('blended_msgs', JSON.stringify(msgs));
    render();
  },800);
}

render();
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
