<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:white;font-family:Arial;height:100vh;display:flex;flex-direction:column}
.header{background:#111;padding:15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px;letter-spacing:2px} .logo span{color:#00ff88}
.back{width:40px;height:40px;border-radius:50%;background:#222;border:none;color:white;font-size:18px}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:12px 16px;border-radius:20px;line-height:1.4}
.me{align-self:flex-end;background:#00ff88;color:black;border-bottom-right-radius:6px}
.other{align-self:flex-start;background:#222;color:white;border-bottom-left-radius:6px}
.input-area{padding:12px;background:#111;display:flex;gap:10px;align-items:center;border-top:1px solid #222}
.input-area input{flex:1;padding:14px 18px;border-radius:25px;border:none;background:#222;color:white;outline:none;font-size:16px}
.send{width:50px;height:50px;border-radius:50%;background:#00ff88;border:none;font-size:20px;font-weight:900}
.time{font-size:10px;opacity:.6;margin-top:4px}
</style></head><body>
<div class="header"><button class="back" onclick="location.href='index.html'">←</button><div class="logo">B <span>BLENDED</span> Chat</div><div style="margin-left:auto;background:#00ff88;color:black;padding:5px 10px;border-radius:12px;font-size:11px;font-weight:900">● LIVE</div></div>
<div class="messages" id="msgs"></div>
<div class="input-area"><input id="input" placeholder="Écris un message..." onkeypress="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getDatabase,ref,push,onChildAdded}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const app=initializeApp({databaseURL:"https://blended-b75d3-default-rtdb.firebaseio.com"});
const db=getDatabase(app);
const chatRef=ref(db,'chats/blended_global');

const msgsDiv=document.getElementById('msgs');
const input=document.getElementById('input');
const myName="Djontu Junior";

onChildAdded(chatRef,(snap)=>{
  const d=snap.val();
  const isMe=d.name===myName;
  const div=document.createElement('div');
  div.className='msg '+(isMe?'me':'other');
  div.innerHTML=`<div>${d.text}</div><div class="time">${d.name} • ${new Date(d.time).toLocaleTimeString()}</div>`;
  msgsDiv.appendChild(div);
  msgsDiv.scrollTop=msgsDiv.scrollHeight;
});

window.send=()=>{
  const text=input.value.trim();
  if(!text) return;
  push(chatRef,{name:myName,text:text,time:Date.now()});
  input.value='';
}
</script>
</body></html>
