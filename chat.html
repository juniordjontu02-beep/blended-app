<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000"><title>Messages IB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100dvh}
.header{height:70px;background:#000;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.left{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:24px}
.title{font-size:22px;font-weight:800}.live{color:#00ff88;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:12px 16px;border-radius:18px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#00ff88;color:#000}.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
.input-wrap{padding:12px;display:flex;gap:10px;border-top:1px solid #111}.input-wrap input{flex:1;padding:14px 18px;border-radius:25px;border:none;background:#1a1a1a;color:#fff;outline:none}
.send{width:48px;height:48px;border-radius:50%;border:none;background:#00ff88;font-weight:bold;font-size:20px}
.navbar{height:70px;background:#0f0f0f;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;align-items:center}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#777;font-size:12px;text-decoration:none;padding:8px 18px;border-radius:16px}
.nav-item.active{background:#1e1e1e;color:#fff}.green-bar{height:12px;background:#00ff88}
</style>
</head>
<body>
<div class="header"><div class="left"><div class="logo">B</div><div class="title">Messages IB</div></div><div class="live"><span class="dot"></span>LIVE</div></div>
<div class="messages" id="msgs"></div>
<div class="input-wrap"><input id="input" placeholder="Écris un message..."><button class="send" id="sendBtn">↑</button></div>
<div class="navbar">
<a class="nav-item" href="index.html">🏠<br>Accueil</a>
<a class="nav-item" href="chat.html">💬<br>Chat</a>
<a class="nav-item active" href="chat.html">🟨<br>IB</a>
<a class="nav-item" href="profil.html">👤<br>Profil</a>
</div><div class="green-bar"></div>
<script>
const GROQ_KEY = "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";
const msgsDiv=document.getElementById('msgs');const input=document.getElementById('input');
function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.innerText=t;msgsDiv.appendChild(d);msgsDiv.scrollTop=msgsDiv.scrollHeight;}
async function askGroq(q){
  addMsg("...","bot");
  try{
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:q}],max_tokens:800})
    });
    const data=await r.json();
    msgsDiv.lastChild.remove();
    if(data.error){addMsg("Erreur: "+data.error.message,"bot");return;}
    addMsg(data.choices[0].message.content,"bot");
  }catch(e){msgsDiv.lastChild.remove();addMsg("Erreur: "+e.message,"bot");}
}
function sendMsg(){const t=input.value.trim();if(!t)return;addMsg(t,"me");input.value='';askGroq(t);}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
document.getElementById('sendBtn').addEventListener('click',sendMsg);
addMsg("Salut ! Je suis IB, comment je peux t'aider ?","bot");
</script>
</body>
</html>
