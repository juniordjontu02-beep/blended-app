<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Messages IB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{height:70px;background:#000;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0}
.left{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:24px}
.title{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.live{color:#00ff88;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.loading{color:#666;text-align:center;margin-top:60px;font-size:16px}
.msg{max-width:82%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#00ff88;color:#000;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1e1e1e;color:#fff;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
.input-wrap{padding:12px 14px;background:#000;display:flex;gap:10px;align-items:center;border-top:1px solid #111}
.input-wrap input{flex:1;padding:14px 18px;border-radius:25px;border:none;background:#1a1a1a;color:#fff;outline:none;font-size:14px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:#00ff88;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#000}
.navbar{height:70px;background:#0f0f0f;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;align-items:center;padding:0 10px;flex-shrink:0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#777;font-size:12px;text-decoration:none;padding:8px 18px;border-radius:16px}
.nav-item.active{background:#1e1e1e;color:#fff}
.nav-item.active .icon{filter:none}
.icon{font-size:18px}
.green-bar{height:10px;background:#00ff88;flex-shrink:0}
</style>
</head>
<body>
<div class="header">
  <div class="left">
    <div class="logo">B</div>
    <div class="title">Messages IB</div>
  </div>
  <div class="live"><span class="dot"></span>LIVE</div>
</div>

<div class="messages" id="msgs">
  <div class="loading" id="load">Chargement...</div>
</div>

<div class="input-wrap">
  <input id="input" placeholder="Écris un message...">
  <button class="send" id="sendBtn">↑</button>
</div>

<div class="navbar">
  <a class="nav-item" href="#"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="#"><span class="icon">💬</span>Chat</a>
  <a class="nav-item active" href="#"><span class="icon">🟨</span>IB</a>
  <a class="nav-item" href="#"><span class="icon">👤</span>Profil</a>
</div>
<div class="green-bar"></div>

<script>
const _a = String.fromCharCode(103,115,107,95);
const _b1 = "iPwvTp46jjkFSJOKKpgMWGdy";
const _b2 = "b3FYT2kpdarj5ZlBewxK4qdNfDTn";
const GROQ_KEY = _a + _b1 + _b2;
const msgsDiv = document.getElementById('msgs');
const input = document.getElementById('input');
const load = document.getElementById('load');
let first = true;
function addMsg(text, who){
  if(first){ load.style.display='none'; first=false; }
  const div=document.createElement('div');
  div.className='msg '+who;
  div.innerText=text;
  msgsDiv.appendChild(div);
  msgsDiv.scrollTop=msgsDiv.scrollHeight;
}
async function askGroq(q){
  addMsg("...", "bot");
  try{
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"user",content:q}],max_tokens:800})
    });
    const data=await r.json();
    msgsDiv.lastChild.remove();
    if(data.error){ addMsg("Erreur: "+data.error.message,"bot"); return; }
    addMsg(data.choices[0].message.content,"bot");
  }catch(e){
    msgsDiv.lastChild.remove();
    addMsg("Erreur: "+e.message,"bot");
  }
}
function sendMsg(){
  const t=input.value.trim(); if(!t) return;
  addMsg(t,"me"); input.value=''; askGroq(t);
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
document.getElementById('sendBtn').addEventListener('click',sendMsg);
// Message d'accueil comme sur ta capture après chargement
setTimeout(()=>{ addMsg("Salut ! Je suis IB, comment je peux t'aider ?","bot"); },800);
</script>
</body>
</html>
