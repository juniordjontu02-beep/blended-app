<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLENDED - Messages</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
<div class="max-w-sm mx-auto">
<div class="p-6 flex items-center justify-between">
<h1 class="font-black text-xl">Messages</h1>
<span class="bg-violet-500 text-[10px] px-3 py-1 rounded-full">3 en ligne</span>
</div>

<div class="px-4 space-y-2">
<div class="flex gap-3 p-3 bg-zinc-900 rounded-2xl border border-zinc-800">
<div class="w-12 h-12 bg-gradient-to-br from-violet-500 to-pink-500 rounded-full flex items-center justify-center font-black">S</div>
<div class="flex-1"><p class="font-bold text-sm">Sophie, 22</p><p class="text-zinc-500 text-xs">Hey! ça va? 😊</p></div>
<div class="text-[10px] text-violet-400">2m</div>
</div>

<div class="flex gap-3 p-3 bg-zinc-900 rounded-2xl border border-zinc-800">
<div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center font-black">J</div>
<div class="flex-1"><p class="font-bold text-sm">Junior</p><p class="text-zinc-500 text-xs">On se capte à Bafoussam?</p></div>
<div class="text-[10px] text-zinc-500">1h</div>
</div>

<div class="flex gap-3 p-3 bg-zinc-900 rounded-2xl border border-zinc-800">
<div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-500 rounded-full flex items-center justify-center font-black">A</div>
<div class="flex-1"><p class="font-bold text-sm">Aminata</p><p class="text-zinc-500 text-xs">Tu as vu mon profil?</p></div>
<div class="text-[10px] text-zinc-500">3h</div>
</div>
</div>

<div class="fixed bottom-0 left-0 right-0 max-w-sm mx-auto p-4 bg-black border-t border-zinc-800 flex gap-2">
<input id="msg" placeholder="Écris un message..." class="flex-1 bg-zinc-900 p-4 rounded-full text-sm outline-none">
<button onclick="send()" class="bg-white text-black w-12 h-12 rounded-full font-black">→</button>
</div>
</div>

<script>
function send(){
let t=document.getElementById('msg').value;
if(!t) return;
alert('Message envoyé: '+t);
document.getElementById('msg').value='';
}
</script>
</body>
</html>
