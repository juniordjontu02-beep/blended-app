<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLENDED AI V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#111;display:flex;gap:10px;border-bottom:1px solid #222}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.me{align-self:flex-end;background:#00ff88;color:#000}
.bot{align-self:flex-start;background:#0a192f;color:#00ff88;border:1px solid #00ff88}
.input-area{padding:12px;background:#111;display:flex;gap:10px}
.input-area input{flex:1;padding:14px;border-radius:25px;border:none;background:#222;color:#fff}
.send{width:50px;height:50px;border-radius:50%;border:none;background:#00ff88;font-weight:bold}
</style>
</head>
<body>
<div class="header"><b>BLENDED AI V2 - Répond à tout 🔥</b></div>
<div class="messages" id="msgs"></div>
<div class="input-area">
<input id="input" placeholder="Pose n'importe quelle question...">
<button class="send" id="sendBtn">↑</button>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getDatabase, ref, push, onChildAdded} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const GROQ_KEY = "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";
const firebaseConfig = { databaseURL: "https://blended-app-7c5b8-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, 'chats/blended_global');
const msgsDiv = document.getElementById('msgs');
const input = document.getElementById('input');
const myName = "Gouverneur";

onChildAdded(chatRef, (s)=>{
  const d=s.val();
  const isBot=d.name.includes("BLENDED");
  const div=document.createElement('div');
  div.className='msg '+(isBot?'bot':'me');
  div.innerText=d.name+": "+d.text;
  msgsDiv.appendChild(div);
  msgsDiv.scrollTop=msgsDiv.scrollHeight;
});

async function askGroq(q){
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+GROQ_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:"Tu es BLENDED, IA créée par Djontu Junior à Bafoussam. Tu es jeune, camerounais, tu tutoies, tu réponds court en français."},{role:"user",content:q}],max_tokens:500})
  });
  const data=await r.json();
  return data.choices[0].message.content;
}

async function sendMsg(){
  const text=input.value.trim(); if(!text) return;
  push(chatRef,{name:myName,text:text,time:Date.now()});
  input.value='';
  const ans=await askGroq(text);
  push(chatRef,{name:"BLENDED AI 🤖",text:ans,time:Date.now()});
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
document.getElementById('sendBtn').addEventListener('click',sendMsg);
</script>
</body>
</html>
