<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IB - BLENDED</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex flex-col h-screen">

<div class="bg-white p-4 flex justify-between items-center">
  <a href="index.html" class="font-bold">← BLENDED</a>
  <span class="text-sm bg-green-500 text-white px-3 py-1 rounded-full">● En ligne</span>
</div>

<div id="messages" class="flex-1 p-4 space-y-3 overflow-y-auto bg-[#111]">
  <div class="bg-white p-3 rounded-2xl rounded-bl-none max-w-[80%]">Salut! Bienvenue sur BLENDED ❤️</div>
</div>

<div class="bg-white p-3 flex gap-2">
  <input id="input" type="text" placeholder="Écris Salut..." class="flex-1 p-3 bg-gray-100 rounded-full outline-none">
  <button onclick="send()" class="bg-purple-600 text-white px-6 py-3 rounded-full font-bold">Envoyer</button>
</div>

<script>
function send(){
  let input = document.getElementById('input');
  let box = document.getElementById('messages');
  if(input.value.trim() === '') return;
  let div = document.createElement('div');
  div.className = 'bg-purple-600 text-white p-3 rounded-2xl rounded-br-none max-w-[80%] ml-auto';
  div.textContent = input.value;
  box.appendChild(div);
  input.value = '';
  box.scrollTop = box.scrollHeight;
}
document.getElementById('input').addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
</script>

</body>
</html>
